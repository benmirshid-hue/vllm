<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بوت محادثة شخصي</title>
  <style>
:root {
  --panel: #1e1f24;
  --text: #f4f4f5;
  --muted: #a1a1aa;
  --accent: #7c9cff;
  --accent-strong: #a8bfff;
  --border: #2f333c;
  --user: #2a3348;
  --bot: #25262c;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", "Tahoma", "Arial", sans-serif;
  color: var(--text);
  background: linear-gradient(165deg, #14151a, #0f1014 70%);
}

.app {
  width: min(760px, 94vw);
  margin: 1.5rem auto;
  padding: 1.25rem;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
}

.header h1 {
  margin: 0 0 0.35rem;
  font-weight: 650;
}

.subtitle {
  margin: 0 0 1rem;
  color: var(--muted);
  line-height: 1.7;
  font-size: 0.92rem;
}

.chat {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  min-height: 45vh;
  max-height: 58vh;
  overflow-y: auto;
  padding: 0.85rem;
  margin-bottom: 1rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #15161a;
}

.bubble {
  max-width: 90%;
  padding: 0.75rem 0.9rem;
  border-radius: 12px;
  line-height: 1.75;
  white-space: pre-wrap;
}

.bubble.user {
  align-self: flex-start;
  background: var(--user);
}

.bubble.bot {
  align-self: flex-end;
  background: var(--bot);
  border: 1px solid var(--border);
}

.bubble .who {
  display: block;
  margin-bottom: 0.25rem;
  color: var(--accent-strong);
  font-size: 0.78rem;
}

.field-label {
  display: block;
  margin-bottom: 0.35rem;
  color: var(--accent-strong);
  font-size: 0.9rem;
}

textarea {
  width: 100%;
  resize: vertical;
  padding: 0.9rem 1rem;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: #15161a;
  color: var(--text);
  line-height: 1.8;
  font-size: 1rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 0.85rem;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 0.7rem 1.15rem;
  background: var(--accent);
  color: #0f1220;
  font-weight: 650;
  cursor: pointer;
}

button.secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

button:disabled {
  opacity: 0.55;
  cursor: wait;
}

.policy {
  margin: 0.6rem 0 0;
  padding: 0.7rem 0.9rem;
  border-radius: 10px;
  background: #3a2230;
  color: #ffd7e4;
  line-height: 1.6;
}

.status {
  min-height: 1.35rem;
  margin-top: 0.9rem;
  color: var(--muted);
}

</style>
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>بوتك الشخصي</h1>
      <p class="subtitle">
        محادثة نصية بالعربية، خاصة بك على هذا الجهاز.
        المحادثات تُحفظ محلياً فقط، وليست للمحتوى الجنسي أو الصريح.
      </p>
    </header>

    <section id="chat" class="chat" aria-live="polite"></section>

    <label class="field-label" for="text">رسالتك</label>
    <textarea
      id="text"
      rows="4"
      placeholder="اكتبي هنا مثل ما تكلمين Cursor…"
    ></textarea>

    <p id="policyNote" class="policy" hidden></p>

    <div class="actions">
      <button id="send" type="button">أرسل</button>
      <button id="clear" type="button" class="secondary">مسح المحادثة</button>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script>
(() => {
  const textEl = document.getElementById("text");
  const statusEl = document.getElementById("status");
  const policyNote = document.getElementById("policyNote");
  const chatEl = document.getElementById("chat");
  const sendBtn = document.getElementById("send");
  const clearBtn = document.getElementById("clear");

  const STORAGE_KEY = "personal-arabic-chat-v1";

  // Soft blocklist for explicit sexual content. Personal bot, not unrestricted.
  const blockedPatterns = [
    /نيك/i,
    /أنیک/i,
    /انيك/i,
    /طيز/i,
    /زب\b/i,
    /كس\b/i,
    /قحب/i,
    /ممحون/i,
    /منيوك/i,
    /\bsex\b/i,
    /\bporn\b/i,
    /\bfuck\b/i,
    /\bcock\b/i,
    /\bpussy\b/i,
    /\banal\b/i,
  ];

  const SYSTEM_PROMPT = [
    "أنتِ مساعدة محادثة نصية شخصية بالعربية، بأسلوب قريب من مساعد Cursor:",
    "مفيدة، مباشرة، واضحة، ومتعاونة.",
    "ردي بالعربية الفصحى المبسطة أو بلهجة مفهومة حسب أسلوب المستخدم.",
    "افهمي الطلب جيداً، واسألي سؤال توضيح واحد فقط إذا لزم.",
    "ممنوع تماماً أي محتوى جنسي أو صريح أو إباحي.",
    "إذا طُلب محتوى ممنوع، ارفضي بلطف واقترحي بديلاً مفيداً.",
    "لا تدّعي أنكِ صوت أو اتصال هاتفي؛ هذه محادثة نصية فقط.",
  ].join(" ");

  let history = [];
  let busy = false;

  function setStatus(message) {
    statusEl.textContent = message;
  }

  function isBlocked(text) {
    return blockedPatterns.some((pattern) => pattern.test(text));
  }

  function showPolicy(message) {
    policyNote.hidden = false;
    policyNote.textContent = message;
  }

  function hidePolicy() {
    policyNote.hidden = true;
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (_) {
      // private local storage may be unavailable
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (_) {
      return [];
    }
  }

  function addBubble(role, text) {
    const bubble = document.createElement("div");
    bubble.className = `bubble ${role}`;
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = role === "user" ? "أنت" : "بوتك";
    const body = document.createElement("div");
    body.textContent = text;
    bubble.appendChild(who);
    bubble.appendChild(body);
    chatEl.appendChild(bubble);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function renderAll() {
    chatEl.innerHTML = "";
    if (!history.length) {
      const welcome =
        "مرحباً. أنا بوتك الشخصي النصي. اكتب لي مثل ما تكتب لـ Cursor، وأرد عليك بالعربية.";
      addBubble("bot", welcome);
      return;
    }
    history.forEach((item) => {
      if (item.role === "user") addBubble("user", item.content);
      if (item.role === "assistant") addBubble("bot", item.content);
    });
  }

  function localFallback(userText) {
    const t = userText.trim();
    if (/^(مرحبا|السلام|هلا|أهلا|اهلا)/i.test(t)) {
      return "أهلاً. كيف أقدر أساعدك اليوم؟";
    }
    if (/من أنت|من انتي|وش تسوين/i.test(t)) {
      return "أنا بوتك الشخصي النصي على هذا الجهاز. اكتب طلبك وأرد عليك خطوة بخطوة.";
    }
    return "فهمت طلبك بشكل عام. اكتب لي تفاصيل أوضح (الهدف + أي قيود)، وأعطيك رداً مباشراً.";
  }

  async function askModel(userText) {
    const messages = [
      { role: "system", content: SYSTEM_PROMPT },
      ...history.slice(-12),
      { role: "user", content: userText },
    ];

    const response = await fetch("https://text.pollinations.ai/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages,
        model: "openai",
        seed: Date.now() % 100000,
      }),
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const reply = (await response.text()).trim();
    if (!reply) throw new Error("empty");
    return reply;
  }

  async function handleUserMessage(raw) {
    const text = raw.trim();
    if (!text || busy) return;

    if (isBlocked(text)) {
      showPolicy("هذا البوت الشخصي لا يكمل المحتوى الجنسي أو الصريح.");
      setStatus("تم رفض الرسالة.");
      return;
    }

    busy = true;
    sendBtn.disabled = true;
    hidePolicy();
    history.push({ role: "user", content: text });
    addBubble("user", text);
    textEl.value = "";
    save();
    setStatus("يفكر في الرد…");

    let reply;
    try {
      reply = await askModel(text);
    } catch (_) {
      reply = localFallback(text);
      setStatus("الخدمة الذكية غير متاحة مؤقتاً؛ استخدمت رداً محلياً.");
    }

    if (isBlocked(reply)) {
      reply = "أفضل نبتعد عن هذا الموضوع. قل لي طلباً عاماً أو عملياً أقدر أساعدك فيه.";
    }

    history.push({ role: "assistant", content: reply });
    addBubble("bot", reply);
    save();
    setStatus("جاهز. اكتب رسالتك التالية.");
    busy = false;
    sendBtn.disabled = false;
    textEl.focus();
  }

  function clearChat() {
    history = [];
    save();
    renderAll();
    hidePolicy();
    setStatus("تم مسح المحادثة المحلية.");
  }

  sendBtn.addEventListener("click", () => handleUserMessage(textEl.value));
  clearBtn.addEventListener("click", clearChat);
  textEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      handleUserMessage(textEl.value);
    }
  });

  history = load();
  renderAll();
  setStatus("بوت محادثة نصية شخصية جاهز على هذا الجهاز.");
  textEl.focus();
})();

</script>
</body>
</html>
