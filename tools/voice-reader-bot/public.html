<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>بوت المكالمة الصوتية العربية</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="call-mode">
  <main class="app">
    <header class="header">
      <p class="eyebrow">edge-tts · صوت ↔ صوت · رد ذكي</p>
      <h1>بوت المكالمة الصوتية</h1>
      <p class="subtitle">
        16 صوت عربي أنثوي عبر edge-tts. لهجة سعودية طبيعية زي مكالمة Cursor.
        كل المواضيع مفتوحة؛ الممنوع فقط المحتوى الجنسي الصريح.
      </p>
    </header>

    <section class="call-card">
      <div id="callPulse" class="pulse" aria-hidden="true"></div>
      <p id="callState" class="call-state">جاهز للمكالمة</p>
      <p id="liveCaption" class="caption">اختر الصوت ثم ابدأ.</p>

      <div class="call-actions">
        <button id="startCall" type="button">بدء المكالمة</button>
        <button id="endCall" type="button" class="danger" hidden>إنهاء</button>
      </div>

      <label class="control">
        <span>الصوت العربي الأنثوي (16)</span>
        <select id="voice"></select>
      </label>
      <label class="control">
        <span>أسلوب الإلقاء</span>
        <select id="delivery">
          <option value="warm">واضح</option>
          <option value="soft">ناعم</option>
          <option value="calm">هادئ</option>
          <option value="lively">أسرع قليلاً</option>
          <option value="close">أبطأ أوضح</option>
        </select>
      </label>
      <label class="control">
        <span>نمط الرد الذكي</span>
        <select id="replyMode">
          <option value="helpful">مفيد وواضح</option>
          <option value="thoughtful">تحليلي</option>
          <option value="curious">أسئلة متابعة</option>
          <option value="concise">مختصر</option>
          <option value="balanced">متوازن</option>
        </select>
      </label>
      <p id="voiceHint" class="hint">جارٍ تحميل الأصوات…</p>
    </section>

    <section id="chat" class="chat" aria-live="polite"></section>

    <details class="fallback" open>
      <summary>إدخال نص إذا المايك غير متاح</summary>
      <textarea id="text" rows="3" placeholder="اكتب رسالتك…"></textarea>
      <button id="send" type="button" class="secondary">إرسال</button>
    </details>

    <p id="policyNote" class="policy" hidden></p>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="app.js?v=cursor-call-10"></script>
</body>
</html>
