<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مكالمة صوتية أنثوية</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="call-mode">
  <main class="app">
    <header class="header">
      <p class="eyebrow">مكالمة صوت ↔ صوت</p>
      <h1>رفيقتك الصوتية</h1>
      <p class="subtitle">
        محادثة مباشرة بالصوت، بصوت أنثوي عربي هادئ.
        بدون أصوات رجال أو أصوات صينية. ليست لقراءة نص ملصوق، وليست للمحتوى الجنسي الصريح.
      </p>
    </header>

    <section class="call-card">
      <div id="callPulse" class="pulse" aria-hidden="true"></div>
      <p id="callState" class="call-state">جاهزة للمكالمة</p>
      <p id="liveCaption" class="caption">اضغطي «ابدئي المكالمة» وتكلّمي بالعربي.</p>

      <div class="call-actions">
        <button id="startCall" type="button">ابدئي المكالمة</button>
        <button id="endCall" type="button" class="danger" hidden>إنهاء</button>
      </div>

      <label class="control">
        <span>محرك الصوت</span>
        <select id="voice">
          <option value="arabic-female" selected>عربي أنثوي (موصى به)</option>
        </select>
      </label>
      <label class="control">
        <span>الدلع</span>
        <input id="dalaa" type="range" min="70" max="100" step="1" value="100" />
      </label>
      <label class="control">
        <span>القرب والتنفس</span>
        <input id="closeness" type="range" min="70" max="100" step="1" value="100" />
      </label>
      <p id="voiceHint" class="hint"></p>
    </section>

    <section id="chat" class="chat" aria-live="polite"></section>

    <details class="fallback">
      <summary>إذا المايك ما اشتغل، اكتبي هنا</summary>
      <textarea id="text" rows="3" placeholder="اكتبي رسالة قصيرة…"></textarea>
      <button id="send" type="button" class="secondary">أرسل نصاً</button>
    </details>

    <p id="policyNote" class="policy" hidden></p>
    <p id="status" class="status" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
