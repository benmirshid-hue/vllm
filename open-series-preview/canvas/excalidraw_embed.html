<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحة Excalidraw — Open Series</title>
  <style>
    html, body, #root { margin: 0; height: 100%; background: #12141a; }
    .bar {
      display: flex; gap: 0.5rem; align-items: center; justify-content: space-between;
      padding: 0.5rem 0.75rem; background: #1b1f2a; color: #eef1f6;
      font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif;
    }
    .bar button {
      border-radius: 999px; border: 1px solid #3a455e; background: #243049;
      color: #eef1f6; padding: 0.4rem 0.8rem; cursor: pointer;
    }
    #app { height: calc(100% - 48px); }
    .note { color: #9aa3b5; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="bar">
    <div>
      <strong>Excalidraw (MIT)</strong>
      <span class="note"> — أساسي / primary · Konva بديل موثّق فقط</span>
    </div>
    <div>
      <button type="button" id="btnExport">تصدير → ImageAssets</button>
      <button type="button" id="btnToArtist">إرفاق لفنّان الشخصيات</button>
    </div>
  </div>
  <div id="app">
    <!-- Production: @excalidraw/excalidraw React embed. Scaffold uses placeholder + bridge. -->
    <iframe
      id="excalidrawFrame"
      title="Excalidraw"
      src="https://excalidraw.com"
      style="border:0;width:100%;height:100%"
      allow="clipboard-read; clipboard-write"
    ></iframe>
  </div>
  <script src="./bridge.js"></script>
</body>
</html>
